<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Stack of books">
  <!-- AcadSync illustration: three textbooks (orange, periwinkle, yellow) with an apple. Hand-drawn SVG, 2026-11-21. -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9B886"/><stop offset="1" stop-color="#E5772D"/></linearGradient>
    <linearGradient id="peri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9C6FB"/><stop offset="1" stop-color="#7D77EA"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#F2B01E"/></linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8F6B"/><stop offset="1" stop-color="#C8402F"/></linearGradient>
  </defs>
  <!-- bottom book -->
  <rect x="8" y="66" width="78" height="17" rx="5" fill="url(#orange)"/>
  <rect x="62" y="69" width="21" height="11" rx="2" fill="#FFF6EE"/>
  <path d="M64 72.5h17M64 76.5h17" stroke="#F3D9C4" stroke-width="1.4"/>
  <rect x="16" y="72" width="30" height="4" rx="2" fill="#FFF6EE" opacity=".8"/>
  <!-- middle book, slightly turned -->
  <g transform="rotate(-4 46 56)">
    <rect x="14" y="49" width="68" height="16" rx="5" fill="url(#peri)"/>
    <rect x="15" y="52" width="18" height="10" rx="2" fill="#F7F6FF"/>
    <path d="M17 55h14M17 59h14" stroke="#DEDCF8" stroke-width="1.4"/>
    <rect x="46" y="54.5" width="26" height="4" rx="2" fill="#F7F6FF" opacity=".85"/>
  </g>
  <!-- top book -->
  <g transform="rotate(3 44 40)">
    <rect x="16" y="33" width="58" height="15" rx="5" fill="url(#sun)"/>
    <rect x="53" y="36" width="18" height="9" rx="2" fill="#FFFBEA"/>
    <path d="M55 39h14M55 42.5h14" stroke="#F3E3A6" stroke-width="1.2"/>
    <rect x="22" y="38.5" width="22" height="4" rx="2" fill="#FFFBEA" opacity=".85"/>
  </g>
  <!-- apple -->
  <path d="M40 31c-7 0-10-6-8.4-12 1.4-5.4 6-7 8.4-5.4 2.4-1.6 7-.1 8.4 5.4C50 25 47 31 40 31Z" fill="url(#apple)"/>
  <path d="M40 14c0-3 1-5 3-6.5" fill="none" stroke="#1C1C21" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M41.5 11.5c3.5-3 7.5-2.5 9-1-2.5 3-6 3.6-9 1Z" fill="#23774F"/>
  <path d="M35 18.5c-1.2 2-1.4 4.4-.6 6.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
</svg>
