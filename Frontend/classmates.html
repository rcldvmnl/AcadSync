<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcadSync · Classmates</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/classmates.css">
</head>
<body class="min-h-screen">
  <div class="lg:pl-24">
    <div class="mx-auto max-w-md px-4 pb-32 pt-6 md:max-w-3xl lg:max-w-6xl lg:px-8 lg:pb-10">
      <header id="header"></header>

      <!-- People | Groups switch, and (admin) the class code on the same line -->
      <div class="cm-tabbar">
        <div class="cm-tabs" role="tablist" aria-label="Classmates view">
          <button type="button" role="tab" id="tab-people" data-tab="people" aria-controls="main">People <span class="cm-count" data-count="people"></span></button>
          <button type="button" role="tab" id="tab-groups" data-tab="groups" aria-controls="groups-panel">Groups <span class="cm-count" data-count="groups"></span></button>
        </div>
        <div class="cm-tabbar-end">
          <a id="records-link" href="records.html" class="cm-records-link" hidden></a>
          <div id="invite" class="cm-invite" hidden></div>
        </div>
      </div>

      <!-- Groups: one block per group assignment, each group drawn as its seats -->
      <section id="groups-panel" role="tabpanel" aria-labelledby="tab-groups" hidden></section>

      <!-- People: search + filter, then one row per classmate with their group for each assignment -->
      <main id="main" role="tabpanel" aria-labelledby="tab-people">
        <div id="filters" class="cm-stats" role="radiogroup" aria-label="Show"></div>
        <form id="search" class="cm-search" role="search">
          <span data-icon="search"></span>
          <input name="q" autocomplete="off" placeholder="Search name or student ID" aria-label="Search classmates by name or student ID">
          <button type="button" data-clear class="cm-clear" aria-label="Clear search" hidden></button>
        </form>
        <div id="list" class="cm-panel">
          <div class="cm-loading"><span></span><span></span><span></span><span></span></div>
        </div>
        <p id="algo" class="cm-algo"></p>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/group-work.js"></script>
  <script src="js/classmates.js"></script>
  <script src="js/groups.js"></script>
</body>
</html>
