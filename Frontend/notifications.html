<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcadSync · Notifications</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <!-- Tailwind, built with the CLI (npm run build:css). Last, as the CDN injected it. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen">
  <div class="lg:pl-24">
    <div class="mx-auto max-w-md px-4 pb-32 pt-6 lg:max-w-3xl lg:px-8 lg:pb-10">
      <header id="header"></header>
      <main id="main">
        <div class="mb-4 grid grid-cols-2 rounded-full bg-white p-1.5 shadow-card" role="tablist">
          <button data-tab="all" role="tab" class="rounded-full py-3 text-sm font-semibold">All</button>
          <button data-tab="unread" role="tab" class="rounded-full py-3 text-sm font-semibold">Unread</button>
        </div>
        <div id="list"><div class="skeleton h-64"></div></div>
        <button id="read-all" class="mt-4 w-full py-2 text-sm font-semibold text-muted" hidden>Mark all as read</button>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
