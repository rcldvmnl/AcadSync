<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcadSync · Search</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <!-- Tailwind, built with the CLI (npm run build:css). Last, as the CDN injected it. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen">
  <div class="lg:pl-24">
    <div class="mx-auto max-w-md px-4 pb-32 pt-6 lg:max-w-3xl lg:px-8 lg:pb-10">
      <header id="header"></header>
      <main id="main">
        <form id="search" class="flex items-center gap-2 rounded-full bg-white px-4 py-1.5 shadow-card" role="search">
          <span data-icon="search"></span>
          <input name="q" class="min-w-0 flex-1 bg-transparent py-2.5 outline-none placeholder:text-hint" placeholder="Search tasks, subjects, classmates" aria-label="Search" autocomplete="off">
        </form>
        <p class="mt-2 px-2 text-xs text-muted">Tasks and subjects are found by walking the section’s tree (Section › Subject › Task). Classmates use a linear search by name.</p>
        <div id="results" class="mt-5 space-y-6"></div>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
