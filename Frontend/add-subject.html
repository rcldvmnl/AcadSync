<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcadSync · Add Subject</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <!-- Tailwind, built with the CLI (npm run build:css). Last, as the CDN injected it. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen">
  <div class="lg:pl-24">
    <div class="mx-auto max-w-md px-4 pb-32 pt-6 lg:max-w-5xl lg:px-8 lg:pb-10">
      <header id="header"></header>
      <main id="main">
        <form id="subject-form" class="grid gap-5 lg:grid-cols-2 lg:items-start" novalidate>
          <section class="space-y-4 rounded-[1.75rem] bg-white p-5 shadow-card">
            <h2 class="text-xl font-bold">Subject</h2>
            <label class="block"><span class="mb-1.5 block text-xs text-muted">Subject code</span>
              <span class="field"><span data-icon="hash"></span><input name="code" placeholder="ITEC 207" required></span></label>
            <label class="block"><span class="mb-1.5 block text-xs text-muted">Subject name</span>
              <span class="field"><span data-icon="bookOpen"></span><input name="title" placeholder="Systems Analysis &amp; Design" required></span></label>
            <label class="block"><span class="mb-1.5 block text-xs text-muted">Instructor</span>
              <span class="field"><span data-icon="user"></span><input name="instructor" placeholder="Prof. R. Garcia"></span></label>
            <label class="block"><span class="mb-1.5 block text-xs text-muted">Room</span>
              <span class="field"><span data-icon="mapPin"></span><input name="room" placeholder="Comp Lab 1"></span></label>
            <div>
              <div class="mb-1.5 text-xs text-muted">Card colour</div>
              <div class="flex gap-2" id="colors"></div>
            </div>
            <div>
              <div class="mb-1.5 text-xs text-muted">Card design</div>
              <div class="flex flex-wrap gap-2" id="designs" role="group" aria-label="Card design"></div>
            </div>
            <div>
              <div class="mb-1.5 text-xs text-muted">How it looks on Home</div>
              <div id="subject-preview" class="max-w-[15rem]" aria-hidden="true"></div>
            </div>
          </section>

          <div class="space-y-5">
            <section class="rounded-[1.75rem] bg-white p-5 shadow-card">
              <h2 class="text-xl font-bold">Weekly schedule</h2>
              <p class="mt-1 text-xs text-muted">Pick the days, then set each day’s own start time and length — e.g. Monday 1:00 PM for 1 hour, Tuesday 2:00 PM for 3 hours.</p>
              <div class="mt-4 mb-1.5 text-xs text-muted">Class days</div>
              <div class="grid grid-cols-6 gap-2" id="days"></div>
              <div id="day-rows" class="mt-4 space-y-3"></div>
            </section>
            <div id="clash-confirm" class="rounded-[1.5rem] bg-peach-tint p-4" role="alert" hidden></div>
            <p data-error class="rounded-2xl bg-danger-tint px-4 py-3 text-sm" hidden></p>
            <button type="submit" class="btn btn-dark w-full">Save subject</button>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/add-subject.js"></script>
</body>
</html>
