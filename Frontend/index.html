<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AcadSync · Log in</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- Tailwind, built with the CLI (npm run build:css). Last, as the CDN injected it. -->
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen bg-white lg:bg-canvas">
  <div class="min-h-screen lg:grid lg:grid-cols-[1.2fr_1fr]">
    <!-- Hero -->
    <section class="hero-academic relative overflow-hidden px-6 pb-16 pt-10 lg:flex lg:flex-col lg:justify-center lg:px-16 lg:pb-10">
      <span class="hero-doodle"></span>
      <span class="sparkle" style="top:20px;right:20px" aria-hidden="true"></span>
      <!-- Desktop: the academic still life (trophy, books, pencil) in the hero's lower corner -->
      <div class="pointer-events-none absolute bottom-10 right-12 hidden h-64 w-80 lg:block" aria-hidden="true">
        <img src="assets/illus/books.svg" alt="" width="190" height="190" class="illus absolute bottom-0 left-0 h-[190px] w-[190px]">
        <img src="assets/illus/trophy.svg" alt="" width="170" height="170" class="illus absolute bottom-6 right-0 h-[170px] w-[170px]">
        <img src="assets/illus/pencil.svg" alt="" width="110" height="110" class="illus absolute -top-4 left-24 h-[110px] w-[110px]">
        <img src="assets/badge-cap-white.png" alt="" width="96" height="96" class="absolute -top-16 right-6 h-24 w-24 rounded-full shadow-float">
      </div>
      <div class="absolute right-8 top-10 lg:hidden">
        <span class="sparkle" style="top:-4px;right:auto;left:-30px;width:24px;height:24px" aria-hidden="true"></span>
        <img src="assets/badge-cap-white.png" alt="" width="96" height="96" class="h-24 w-24 rounded-full">
      </div>
      <div class="relative">
        <div class="flex items-center gap-3">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-charcoal text-sm font-bold text-white"><img src="assets/logo-128.png" alt="" width="36" height="36" class="h-9 w-9"></span>
          <span class="text-lg font-bold">AcadSync</span>
        </div>
        <h1 class="mt-8 text-[28px] font-extrabold leading-[1.15] tracking-tight lg:text-5xl">Your academics<span class="-ml-[0.05em]">,</span><br>perfectly in sync<span class="-ml-[0.05em]">.</span></h1>
        <p class="mt-3 text-xs font-medium lg:hidden">For all students · LSPU</p>
        <p class="mt-4 hidden max-w-md text-sm lg:block">Class schedules, deadlines and study groups for all students — all in one place.</p>
      </div>
    </section>

    <!-- Form -->
    <main class="relative -mt-8 rounded-t-[2.25rem] bg-white px-6 pb-10 pt-3 lg:mt-0 lg:flex lg:items-center lg:justify-center lg:rounded-none lg:px-16">
      <div class="mx-auto mb-6 h-1 w-9 rounded-full bg-line lg:hidden"></div>
      <form id="login" class="mx-auto w-full max-w-sm" novalidate>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-muted">Welcome back</p>
        <h2 class="mt-2 text-[26px] font-bold tracking-tight">Log in to your account</h2>
        <div class="mt-5 space-y-4">
          <label class="block">
            <span class="mb-1.5 block text-xs text-muted">University e-mail or username</span>
            <span class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m22 7-10 6L2 7"/></svg>
              <input name="login" autocomplete="username" placeholder="0000-0000@lspu.edu.ph" required></span>
          </label>
          <label class="block">
            <span class="mb-1.5 block text-xs text-muted">Password</span>
            <span class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></span>
          </label>
        </div>
        <div class="mt-3 text-right"><button type="button" id="forgot" class="text-sm font-semibold">Forgot password?</button></div>
        <p data-error class="mt-3 rounded-2xl bg-danger-tint px-4 py-3 text-sm" hidden></p>
        <button type="submit" class="btn btn-dark mt-5 w-full">Log in</button>
        <p class="mt-5 text-center text-sm text-muted lg:text-center">Don’t have an account? <a href="signup.html" class="font-semibold text-charcoal">Sign up</a></p>
      </form>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
